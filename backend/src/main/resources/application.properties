# ============================================================
# HSSC Courier - Configuracion de la Aplicacion
# ============================================================

spring.application.name=hssc-courier

# ------------------------------------------------------------
# Base de Datos MySQL
# ------------------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/hssc_courier?useSSL=false&serverTimezone=America/Lima&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ------------------------------------------------------------
# JPA / Hibernate
# ------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Preservar el casing exacto camelCase de las columnas de MySQL (idUsuario, no id_usuario)
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyComponentPathImpl

# ------------------------------------------------------------
# Servidor
# ------------------------------------------------------------
server.port=8080
server.error.include-message=always

# ------------------------------------------------------------
# JWT
# ------------------------------------------------------------
app.jwt.secret=hssc-courier-secret-key-2026-very-long-secure-key-for-jwt-signing
app.jwt.expiration-ms=86400000

# ------------------------------------------------------------
# CORS - origen del frontend
# ------------------------------------------------------------
app.cors.allowed-origins=http://localhost:5173

# ------------------------------------------------------------
# Logging
# ------------------------------------------------------------
logging.level.com.hssc=INFO
logging.level.org.springframework.security=WARN
